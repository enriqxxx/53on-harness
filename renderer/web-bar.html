<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Body</title>
<link rel="stylesheet" href="toolbar.css">
<style>
.titlebar{height:32px;gap:4px;padding-left:6px}
.btn{height:26px;min-width:28px;padding:0 6px}.btn:disabled{opacity:.35}
#u{-webkit-app-region:no-drag;app-region:no-drag;flex:1;min-width:120px;max-width:900px;height:24px;margin:0 8px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:13px 'Segoe UI',system-ui,sans-serif;outline:none;user-select:text}
#u:focus{border-color:#7c5cff}
#r.busy svg{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body><div class="titlebar">
<button class="btn" id="b" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="btn" id="f" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
<button class="btn" id="r"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
<input id="u" spellcheck="false" autocomplete="off">
</div><script src="web-bar.js"></script></body></html>
