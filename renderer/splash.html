<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg:#0f1420; --fg:#e6ebf5; --dim:#8a97b3; --ring:rgba(255,255,255,.14); }
  :root[data-theme=light] { --bg:#ffffff; --fg:#111b21; --dim:#667781; --ring:rgba(0,0,0,.12); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, sans-serif; }
  .card {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); border-radius: 20px; color: var(--fg);
    -webkit-app-region: drag;   /* se puede arrastrar el splash */
  }
  img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 34px rgba(124,92,255,.4); }
  .name { font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; }
  .spin { width: 26px; height: 26px; border: 3px solid var(--ring); border-top-color: #7c5cff; border-radius: 50%; animation: spin .8s linear infinite; }
  .sub { font-size: .78rem; color: var(--dim); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="53on">
    <div class="name">53ON</div>
    <div class="spin"></div>
    <div class="sub">Opening 53on…</div>
  </div>
</body>
</html>
