name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          path: dist/53on-setup.exe
          archive: false
          if-no-files-found: error
      # Runs once the SignPath project exists: its organization id goes in a repository variable, its token in a secret
      - name: Sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 53on-harness
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload the signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: 53on-setup-signed
          path: signed/53on-setup.exe
          if-no-files-found: error
